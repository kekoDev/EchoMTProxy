[package]
name = "echo-mtproxy"
version = "0.1.0"
edition = "2021"
authors = ["telegramvpn.org"]
description = "High-performance Fake-TLS MTProto proxy for Telegram"
license = "Apache-2.0"
repository = "https://github.com/kekoDev/EchoMTProxy"
readme = "README.md"
publish = false

[dependencies]
aes = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctr = "0.9"
hex = "0.4"
hmac = "0.12"
mimalloc = { version = "0.1", default-features = false, optional = true }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
socket2 = "0.5"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "signal", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
# setsockopt for the two socket options socket2 does not expose.
libc = "0.2"

[features]
default = ["mimalloc"]
# mimalloc as the global allocator of the binary. Measured on the target server
# against glibc malloc: 4.1 vs 4.6 KiB resident per idle session and 6% more
# handshakes per second. Build with --no-default-features for the system allocator.
mimalloc = ["dep:mimalloc"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
dhat = "0.3"
libc = "0.2"
proptest = "1"
serde_json = "1"
tokio = { version = "1", features = ["process", "test-util"] }

[[bench]]
name = "cipher"
harness = false

[[bench]]
name = "handshake"
harness = false

[[bench]]
name = "relay"
harness = false

[[bench]]
name = "limiting_ab"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding, not abort: a panic must end one connection's task, not the process.
panic = "unwind"
strip = true
