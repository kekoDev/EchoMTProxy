# Copy to config.toml and edit. config.toml is gitignored; never commit real secrets.

listen = ["0.0.0.0:443", "[::]:443"]
workers = 0                      # 0 = number of CPUs

# Fake-TLS secrets: "ee" + 32 hex chars (16-byte key) + hex of the domain.
# Generate one with: echo-mtproxy --gen-secret www.example.com
# The value below is an example (zero key, www.example.com). Replace it.
secrets = ["ee000000000000000000000000000000007777772e6578616d706c652e636f6d"]

# Masking: a connection that fails the handshake is forwarded, bytes and all,
# to a real TLS site, so probes see that site's answers.
#
# mask_domains is an allowlist of SNI names. If the failed ClientHello carries
# one of them (exact match, case-insensitive), the connection goes to that
# entry; anything else goes to mask_host. The client's SNI only selects among
# these entries and is never resolved itself.
#   "domain"            forward to domain:443
#   "domain=host:port"  forward to host:port (e.g. a site on this server)
# Clients may use any listed domain with the same key:
#   echo-mtproxy --gen-secret    new key, one link per listed domain
#   echo-mtproxy --print-links   links for the keys already in `secrets`
mask_domains = []
# mask_domains = ["google.com", "facebook.com", "instagram.com", "site.example.org=127.0.0.1:8443"]
mask_host = ""                   # host or host:port; empty = domain of the first secret
mask_max_connections = 4096      # concurrent masked connections; beyond this, no reply
mask_idle_timeout_secs = 120     # drop a masked connection when either direction is silent this long
mask_dns_ttl_secs = 300          # how long a resolved mask host is reused; 0 = resolve every time
prefer_ipv6_upstream = true
# Local source addresses for connections to Telegram, used in rotation per
# address family. One source address can only hold a limited number of
# connections to one DC address (the ephemeral port range), so list every
# address this server has, e.g. its IPv4 address and all its IPv6 addresses.
# Empty = let the kernel choose. Each address must be assigned to this host.
upstream_bind_addrs = []
# upstream_bind_addrs = ["203.0.113.5", "2001:db8::10", "2001:db8::11", "2001:db8::12", "2001:db8::13"]

# Media limiting. A connection whose client marks it as media (negative DC
# index) may relay media_burst_bytes at full speed, then media_rate_bps, both
# directions counted together. It is slowed by reading later, never by dropping
# data, and the kernel paces its client socket at the same rate once the burst
# is spent. Chat connections are never limited.
#
# Both values are PER CONNECTION, not per user. A Telegram client fetches one
# file over several media connections in parallel (4 were observed in a
# real-device test), and each of them gets its own burst and rate.
# What a user sees is therefore roughly:
#   burst  = media_burst_bytes x parallel connections
#   speed  = media_rate_bps    x parallel connections
# With the defaults and 4 connections that is 8 MB at full speed, then about
# 4 Mbit/s. Pick the per-connection values by dividing what you want a user to
# get by the number of connections you observe.
media_burst_bytes = 2000000      # 2 MB per media connection
media_rate_bps = 1000000         # 1 Mbit/s per media connection; 0 = unlimited

# Congestion control. When the proxy's relay egress exceeds
# congestion_threshold x link_capacity_bps, every media rate is scaled down by
# the same proportion (to no less than 5%), then recovers 10% per 200 ms.
# Set link_capacity_bps to the measured real throughput of your uplink, not
# the nominal port speed. 0 disables congestion control.
link_capacity_bps = 5000000000   # 5 Gbit/s
congestion_threshold = 0.85

# AES passes per byte (client->DC / DC->client):
#   fast        2 / 0   obfuscated upstream reusing the client's key for the DC->client leg
#   obfuscated  2 / 2   obfuscated upstream with independent keys
#   plain       1 / 1   experimental: unobfuscated upstream, not yet verified against real DCs
#   middle      2 / 2   through Telegram's middle proxies (AES-CTR + AES-CBC + CRC32 each way)
upstream_mode = "fast"

# Sponsored channel. Register the proxy with @MTProxybot, put the tag it gives
# you here and set upstream_mode = "middle"; the tag works in no other mode.
# In middle mode Telegram is told each client's IP address and port.
ad_tag = ""                      # 32 hex characters
# Middle-proxy list and secret. Empty = the ones built into the binary.
# Telegram changes them, so refresh these files from cron (see README); a
# changed file is picked up within a minute without a restart.
#   https://core.telegram.org/getProxyConfig  and  .../getProxyConfigV6
#   https://core.telegram.org/getProxySecret
middle_proxy_config_files = []
middle_proxy_secret_file = ""
# This server's address as Telegram sees it, if the address on the interface
# is a different one (NAT). Middle-proxy keys depend on it. Empty = the
# address of the outgoing connection.
public_ipv4 = ""
public_ipv6 = ""

# Accepted client clock error. A ClientHello is valid for behind + ahead seconds.
time_skew_behind_secs = 600      # client clock may lag the proxy by this much
time_skew_ahead_secs = 1200      # client clock may lead the proxy by this much
# Some clients send uptime instead of Unix time. Accepting those timestamps means
# such a handshake can be replayed once it has aged out of the replay cache.
accept_uptime_timestamps = true

# Replay cache size per generation, split over up to 64 shards. Two generations
# are kept so every entry lives for at least behind + ahead seconds. Each
# handshake stores 2 entries. The tables have a fixed size: 85.3 bytes per entry
# configured here (32-byte slots, 4/3 slots per entry, two generations), so the
# default reserves 171 MB at startup; pages become resident as they are used.
# If a shard fills up before the window elapses it drops its older generation
# early and a warning is logged.
replay_cache_entries = 2000000

handshake_timeout_secs = 10
idle_timeout_secs = 900          # close a session after this long with no bytes either way; 0 = never
# Client connections open at once, in any state. Connections beyond this get no
# reply: a few are held silently until the handshake timeout, the rest are closed.
max_connections = 2000000
metrics_listen = "127.0.0.1:9100" # Prometheus text at /metrics; "" disables
cipher_backend = "rustcrypto"    # rustcrypto | openssl (openssl is not built yet)

# Optional per-DC upstream address override (DC ids 1-5).
# [dc_override]
# 5 = "91.108.56.100:443"
# The same for a DC's IPv6 address only:
# [dc_override_v6]
# 5 = "[2001:b28:f23f:f005::a]:443"
